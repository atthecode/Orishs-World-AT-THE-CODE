name: Azure Static Web Apps — Orish Family Beta

on:
  push:
    branches:
      - main
    paths:
      - 'family-app/**'
      - '.github/workflows/azure-static-web-apps-family-beta.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Family Beta
    steps:
      - uses: actions/checkout@v4
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_PEBBLE_09C35F110 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/family-app"
          api_location: ""
          output_location: ""
          skip_app_build: true
