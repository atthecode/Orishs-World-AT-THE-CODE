name: Import Orish World V1.19

on:
  pull_request:
    branches: [main]
    paths:
      - 'Orishs-World-AT-THE-CODE-v1.19-release-ready.zip'

permissions:
  contents: write
  pull-requests: read

jobs:
  unpack-v119:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and extract original V1.19 release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Orishs-World-AT-THE-CODE-v1.19-release-ready.zip'
          EXPECTED_SHA256='2e912784ef993488e73f43b696a03e4fddac1553d2688c058340b4730911baf1'

          # A follow-up synchronize event can occur after the workflow removes
          # the ZIP. Treat that as an already-completed import, not a failure.
          if [ ! -f "$ZIP" ]; then
            echo 'Release ZIP is no longer present; import has already been applied.'
            exit 0
          fi

          ACTUAL_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Release ZIP SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          unzip -tqq "$ZIP"

          rm -rf /tmp/orish-v119
          mkdir -p /tmp/orish-v119
          unzip -q "$ZIP" -d /tmp/orish-v119

          SRC='/tmp/orish-v119/orishs-world-v1.19'
          test -f "$SRC/index.html"
          test -f "$SRC/app.js"
          test -f "$SRC/styles.css"
          test -f "$SRC/manifest.webmanifest"
          test -f "$SRC/service-worker.js"
          test -d "$SRC/modules"
          test -d "$SRC/assets"

          # Preserve git metadata and this workflow while replacing the
          # temporary bootstrap with the exact release-ready app.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ZIP" \
            -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f "$ZIP"
          rm -rf .bootstrap

      - name: Verify imported app
        shell: bash
        run: |
          set -euo pipefail
          # If this is the harmless follow-up run after ZIP removal, there is
          # nothing new to commit and the already-imported app is still checked.
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f RELEASE-CHECKLIST.md
          test -f assets/apple-touch-icon.png
          test -f assets/icon-192.png
          test -f assets/icon-512.png
          test -f assets/orish-explorer.webp
          test -f assets/learning-adventures.webp
          test -f modules/orish-intelligence-engine.js
          test -f modules/parent-controls-engine.js
          node --check app.js
          for f in modules/*.js; do node --check "$f"; done
          echo "Verified V1.19 files: $(find . -type f ! -path './.git/*' | wc -l)"

      - name: Commit exact V1.19 app to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No new changes to commit.'
            exit 0
          fi
          git commit -m "Import exact Orish's World V1.19 release"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
