name: Import Orish World V1.19

on:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/RUN-PR'

permissions:
  contents: write
  pull-requests: read

jobs:
  unpack-v119:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Rebuild and extract V1.19 package
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/RUN-PR
          test -f .bootstrap/part-000.b64
          test -f .bootstrap/part-010.b64

          echo "Bootstrap diagnostics"
          for f in .bootstrap/part-*.b64; do
            size=$(wc -c < "$f" | tr -d ' ')
            clean=$(LC_ALL=C tr -cd 'A-Za-z0-9+/=' < "$f" | wc -c | tr -d ' ')
            invalid=$(LC_ALL=C grep -o '[^A-Za-z0-9+/=[:space:]]' "$f" 2>/dev/null | wc -l || true)
            echo "$(basename "$f"): chars=$size clean=$clean invalid=$invalid"
          done

          # Part 006 was shortened during an earlier repair attempt. Recover its
          # complete pre-repair contents, then strip only wrapper/formatting
          # characters from every chunk. This preserves the Base64 payload.
          ORIGINAL_PART006_COMMIT="3426abd61bfd2c64b076a6b0dff54c7387930e49"
          TMP_B64=/tmp/orish-v119.b64
          : > "$TMP_B64"

          for f in .bootstrap/part-*.b64; do
            name=$(basename "$f")
            if [ "$name" = "part-006.b64" ]; then
              git show "${ORIGINAL_PART006_COMMIT}:.bootstrap/part-006.b64" \
                | LC_ALL=C tr -cd 'A-Za-z0-9+/=' >> "$TMP_B64"
            else
              LC_ALL=C tr -cd 'A-Za-z0-9+/=' < "$f" >> "$TMP_B64"
            fi
          done

          combined=$(wc -c < "$TMP_B64" | tr -d ' ')
          echo "Combined cleaned base64 chars: $combined"
          if [ $((combined % 4)) -ne 0 ]; then
            echo "Cleaned Base64 length is not divisible by 4"
            exit 1
          fi

          base64 --decode "$TMP_B64" > /tmp/orish-v119.bundle.xz
          xz -t /tmp/orish-v119.bundle.xz
          xz -dc /tmp/orish-v119.bundle.xz > /tmp/orish-v119.bundle

          mkdir -p /tmp/orish-v119
          if unzip -tqq /tmp/orish-v119.bundle >/dev/null 2>&1; then
            echo "Detected ZIP payload"
            unzip -q /tmp/orish-v119.bundle -d /tmp/orish-v119
          elif tar -tf /tmp/orish-v119.bundle >/dev/null 2>&1; then
            echo "Detected TAR payload"
            tar -xf /tmp/orish-v119.bundle -C /tmp/orish-v119
          else
            echo "Unsupported decoded payload"
            file /tmp/orish-v119.bundle || true
            exit 1
          fi

          SRC=/tmp/orish-v119
          if [ ! -f "$SRC/index.html" ]; then
            FIRST_DIR="$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/index.html" ]; then
              SRC="$FIRST_DIR"
            fi
          fi

          test -f "$SRC/index.html"
          test -f "$SRC/app.js"
          test -d "$SRC/modules"
          test -d "$SRC/assets"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.bootstrap' \
            -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf .bootstrap

      - name: Verify imported app
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f RELEASE-CHECKLIST.md
          test -f assets/icon-192.png
          test -f assets/icon-512.png
          test -f modules/orish-intelligence-engine.js
          test -f modules/parent-controls-engine.js
          node --check app.js
          for f in modules/*.js; do node --check "$f"; done
          echo "Imported files: $(find . -type f ! -path './.git/*' | wc -l)"

      - name: Commit extracted V1.19 app to import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Orish's World V1.19 app"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
