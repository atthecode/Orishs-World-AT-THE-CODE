name: Import Orish World V1.19

on:
  push:
    branches: [import-v119-review]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/import-v119.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-v119:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: import-v119-review
          fetch-depth: 0

      - name: Rebuild, verify and extract V1.19 release
        shell: bash
        run: |
          set -euo pipefail

          # A follow-up run can occur after the bootstrap folder has been removed.
          # In that case the real app should already be present and only needs checking.
          if [ ! -d .bootstrap ]; then
            echo 'Bootstrap folder is gone; verifying the imported app.'
            test -f index.html
            test -f app.js
            test -f styles.css
            test -f manifest.webmanifest
            test -f service-worker.js
            exit 0
          fi

          test -f .bootstrap/READY
          shopt -s nullglob
          PARTS=(.bootstrap/part-*.b64)
          test "${#PARTS[@]}" -gt 0

          ZIP='/tmp/Orishs-World-AT-THE-CODE-v1.19-release-ready.zip'
          EXPECTED_SHA256='2e912784ef993488e73f43b696a03e4fddac1553d2688c058340b4730911baf1'

          # The bootstrap files are consecutive pieces of one base64-encoded ZIP.
          cat "${PARTS[@]}" | tr -d '\r\n' | base64 --decode > "$ZIP"

          ACTUAL_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Release ZIP SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          unzip -tqq "$ZIP"

          rm -rf /tmp/orish-v119
          mkdir -p /tmp/orish-v119
          unzip -q "$ZIP" -d /tmp/orish-v119

          SRC='/tmp/orish-v119/orishs-world-v1.19'
          test -f "$SRC/index.html"
          test -f "$SRC/app.js"
          test -f "$SRC/styles.css"
          test -f "$SRC/manifest.webmanifest"
          test -f "$SRC/service-worker.js"
          test -d "$SRC/modules"
          test -d "$SRC/assets"

          # Replace only the temporary bootstrap payload. Keep git metadata,
          # the workflow and README while copying the exact app into the repo root.
          cp -a "$SRC"/. .
          rm -rf .bootstrap

      - name: Verify imported app
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f RELEASE-CHECKLIST.md
          test -f assets/apple-touch-icon.png
          test -f assets/icon-192.png
          test -f assets/icon-512.png
          test -f assets/orish-explorer.webp
          test -f assets/learning-adventures.webp
          test -f modules/orish-intelligence-engine.js
          test -f modules/parent-controls-engine.js
          node --check app.js
          for f in modules/*.js; do node --check "$f"; done
          echo "Verified V1.19 files: $(find . -type f ! -path './.git/*' | wc -l)"

      - name: Commit exact V1.19 app to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No new changes to commit.'
            exit 0
          fi
          git commit -m "Import exact Orish's World V1.19 release"
          git push origin HEAD:import-v119-review
