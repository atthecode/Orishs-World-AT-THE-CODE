name: Fix Orish picture placement

on:
  push:
    branches:
      - feature/azure-mvp-v128

permissions:
  contents: write

jobs:
  patch-picture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/azure-mvp-v128

      - name: Replace Talk to Orish placeholder with Orish
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('index.html')
          text = html.read_text()
          old = '<div class="orish-avatar large" aria-hidden="true"><span class="orish-head">O</span><span class="orish-body"></span></div>'
          new = '<div class="orish-avatar large orish-live-character" aria-hidden="true"><img src="assets/orish-explorer.webp" alt="" class="orish-live-character-img"></div>'
          if old in text:
              html.write_text(text.replace(old, new, 1))

          css = Path('styles.css')
          css_text = css.read_text()
          marker = '/* Azure picture alignment: Orish live chat */'
          if marker not in css_text:
              css_text += '''\n\n/* Azure picture alignment: Orish live chat */\n.orish-live-character{width:230px;height:300px;display:grid;place-items:end center;overflow:visible;filter:drop-shadow(0 20px 30px rgba(0,0,0,.3))}\n.orish-live-character-img{display:block;max-width:100%;max-height:300px;width:auto;height:auto;object-fit:contain;object-position:center bottom}\n@media(max-width:520px){.orish-live-character{width:200px;height:260px}.orish-live-character-img{max-height:260px}}\n'''
              css.write_text(css_text)
          PY

      - name: Commit picture fix
        run: |
          if git diff --quiet; then
            echo "Picture already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Show Orish in live chat stage"
          git push origin HEAD:feature/azure-mvp-v128
